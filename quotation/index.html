<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mauli Tours & Travels - Tour Quotation</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f8f4;
    color:#222;
}

.container{
    max-width:900px;
    margin:30px auto;
    padding:20px;
}

.form-card{
    background:#fff;
    border-radius:16px;
    padding:25px;
    box-shadow:0 5px 25px rgba(0,0,0,.08);
}

h1{
    text-align:center;
    color:#16824b;
    margin-bottom:8px;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-bottom:25px;
}

.section-title{
    background:#e9f7ef;
    color:#16824b;
    padding:11px 14px;
    border-left:5px solid #16824b;
    border-radius:6px;
    margin-top:25px;
    margin-bottom:15px;
    font-weight:bold;
}

label{
    display:block;
    margin-top:12px;
    margin-bottom:6px;
    font-weight:600;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    border:1px solid #ccc;
    border-radius:7px;
    font-size:15px;
}

textarea{
    min-height:100px;
    resize:vertical;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

.full{
    grid-column:1/-1;
}

.buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:25px;
}

button{
    border:none;
    padding:13px 18px;
    border-radius:8px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
}

.generate{
    background:#16824b;
    color:white;
    flex:1;
}

.save{
    background:#e9f7ef;
    color:#16824b;
}

.load{
    background:#f1f1f1;
    color:#333;
}

.note{
    margin-top:15px;
    font-size:13px;
    color:#777;
    text-align:center;
}

@media(max-width:650px){
    .container{
        margin:10px auto;
        padding:10px;
    }

    .form-card{
        padding:17px;
    }

    .grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .buttons{
        flex-direction:column;
    }

    button{
        width:100%;
    }
}
</style>
</head>

<body>

<div class="container">

<div class="form-card">

<h1>Mauli Tours & Travels</h1>

<div class="subtitle">
Tour Quotation Generator
</div>

<form id="quotationForm">

<div class="section-title">Quotation Details</div>

<div class="grid">

<div>

<input type="text" id="quotationNo" readonly>
</div>

<div>

<input type="date" id="quotationDate">

<div>
<label>Valid Until</label>
<input type="date" id="validUntil">
</div>

</div>


<div class="section-title">Customer Details</div>

<div class="grid">

<div>
<label>Customer Name *</label>
<input type="text" id="customerName" required>
</div>

<div>
<label>Mobile Number *</label>
<input type="tel" id="mobile" required>
</div>

<div>
<label>Email</label>
<input type="email" id="email">
</div>

</div>


<div class="section-title">Trip Details</div>

<input type="text" id="destination" required>

<div>

<input type="text" id="pickup" required>

<div>

<input type="date" id="travelDate" required>

<div class="section-title">Stay • Meals • Vehicle</div>

<div class="grid">

<div>

<select id="stay">

<div>
<label>Vehicle</label>

<option value="">Select</option>

</div>


<div class="section-title">Itinerary</div>

<div class="full">

<label>Day-wise Itinerary</label>

placeholder="Day 1
Pickup from Your Location
Breakfast Stop
Sightseeing
Hotel Check-in

Day 2
Breakfast
Sightseeing
Shopping
Return to Your Location"></textarea>

</div>

</div>


<div class="section-title">Package Cost</div>

<div class="grid">

<div>

<label>Total Package Price (Rs.) *</label>

<input
type="number"
id="packagePrice"
placeholder="10000"
required
>

</div>

</div>


<div class="section-title">Inclusions</div>

<textarea id="inclusions"
placeholder="- Pickup & Drop
- Private AC Car

- Driver Allowance

placeholder="- Meals (Unless Specified)

placeholder="Any special request from customer"></textarea>


<div class="section-title">Terms & Conditions</div>

<textarea id="terms">1. Booking will be confirmed only after receipt of the full package payment.
2. Package inclusions and exclusions are as stated in the quotation.
3. The customer is responsible for providing correct booking information including name, travel dates, number of passengers and pickup location.
4. Changes or cancellations may attract applicable charges depending on the booking and travel date.
5. Extra services, personal expenses, entry fees and activities not specifically mentioned in the package are payable separately.
6. Travel plans may be adjusted due to traffic, weather, road conditions, local restrictions, safety concerns or unavoidable circumstances.
7. Customers are responsible for their personal belongings, valuables, documents and luggage.
8. Hotel category, room type and meal plan will be as specified in the confirmed package.
9. Customers are expected to maintain respectful behaviour with drivers, staff, hotels and service personnel.
10. By making the full payment, the customer confirms that they have read and accepted the quotation, package details, payment terms and these Terms & Conditions.</textarea>


<div class="buttons">

<button
type="button"
class="generate"
onclick="generatePDF()">
Generate Quotation PDF
</button>

<button
type="button"
class="save"
onclick="saveDraft()">
Save Draft
</button>

<button
type="button"
class="load"
onclick="loadDraft()">
Load Saved Draft
</button>

</div>

<div class="note">
Quotation PDF is generated directly on your device.
</div>

</form>

</div>
</div>


<script>

const { jsPDF } = window.jspdf;


/* -----------------------------
   DATE FUNCTIONS
----------------------------- */

function todayISO(){

    const d = new Date();

    const month = String(d.getMonth()+1).padStart(2,'0');

    const day = String(d.getDate()).padStart(2,'0');

    return `${d.getFullYear()}-${month}-${day}`;
}


function formatDate(value){

    if(!value) return "-";

    const d = new Date(value + "T00:00:00");

    return d.toLocaleDateString("en-GB",{
        day:"2-digit",
        month:"short",
        year:"numeric"
    });
}


/* -----------------------------
   QUOTATION NUMBER
----------------------------- */

function generateQuotationNumber(){

    const today = new Date();

    const year = today.getFullYear();

    const month = String(today.getMonth()+1).padStart(2,'0');

    const day = String(today.getDate()).padStart(2,'0');

    const key = `mauliQuotationSequence_${year}${month}${day}`;

    let sequence = parseInt(localStorage.getItem(key) || "0",10);

    sequence++;

    localStorage.setItem(key,sequence);

    return `MTT-${year}${month}${day}-${String(sequence).padStart(3,'0')}`;
}


/* -----------------------------
   DEFAULT VALUES
----------------------------- */

document.getElementById("quotationDate").value = todayISO();

const valid = new Date();

valid.setDate(valid.getDate()+4);

document.getElementById("validUntil").value =
valid.toISOString().split("T")[0];

document.getElementById("quotationNo").value =
generateQuotationNumber();


/* -----------------------------
   TEXT CLEANING
----------------------------- */

function cleanLines(text){

    if(!text) return [];

    return text
        .split(/\r?\n/)
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => {

            line = line.replace(/^[•●▪◦]\s*/,"");

            line = line.replace(/^[-–—]\s*/,"");

            return "- " + line;

        });

}


/* -----------------------------
   TEXT WRAPPING
----------------------------- */

function wrapText(doc,text,maxWidth){

    return doc.splitTextToSize(
        String(text || ""),
        maxWidth
    );

}


/* -----------------------------
   PAGE SPACE CHECK
----------------------------- */

function checkPageSpace(doc,y,requiredHeight){

    const pageHeight = doc.internal.pageSize.getHeight();

    const bottomLimit = pageHeight - 25;

    if(y + requiredHeight > bottomLimit){

        addFooter(doc);

        doc.addPage();

        addPageWatermark(doc);

        return 25;

    }

    return y;

}


/* -----------------------------
   FOOTER
----------------------------- */

function addFooter(doc){

    const pageWidth =
        doc.internal.pageSize.getWidth();

    const pageHeight =
        doc.internal.pageSize.getHeight();

    doc.setDrawColor(22,130,75);

    doc.setLineWidth(0.5);

    doc.line(
        15,
        pageHeight-17,
        pageWidth-15,
        pageHeight-17
    );

    doc.setFont("helvetica","bold");

    doc.setFontSize(8);

    doc.setTextColor(22,130,75);

    doc.text(
        "Mauli Tours & Travels",
        pageWidth/2,
        pageHeight-11,
        {align:"center"}
    );

    doc.setFont("helvetica","normal");

    doc.setTextColor(90,90,90);

    doc.text(
        "Pune, Maharashtra | 9226718177",
        pageWidth/2,
        pageHeight-7,
        {align:"center"}
    );

    doc.text(
        "maulitoursandtravels2150@gmail.com | www.maulitoursandtravels.co.in",
        pageWidth/2,
        pageHeight-3,
        {align:"center"}
    );

}


/* -----------------------------
   WATERMARK
----------------------------- */

function addPageWatermark(doc){

    try{

        const pageWidth =
            doc.internal.pageSize.getWidth();

        const pageHeight =
            doc.internal.pageSize.getHeight();

        const img =
            document.getElementById("logoImage");

        if(!img) return;

        doc.saveGraphicsState();

        if(doc.GState){

            const gs = new doc.GState({
                opacity:0.06
            });

            doc.setGState(gs);

        }

        doc.addImage(
            img,
            "PNG",
            pageWidth/2 - 35,
            pageHeight/2 - 35,
            70,
            70
        );

        doc.restoreGraphicsState();

    }catch(e){

        /* watermark is optional */

    }

}


/* -----------------------------
   LOGO LOADING
----------------------------- */

function loadLogo(){

    return new Promise((resolve)=>{

        const img =
            new Image();

        img.onload = function(){

            resolve(img);

        };

        img.onerror = function(){

            resolve(null);

        };

        img.src = "LOGO.png";

    });

}


/* -----------------------------
   SECTION HEADING
----------------------------- */

function addSectionHeading(doc,title,y){

    y = checkPageSpace(
        doc,
        y,
        14
    );

    const pageWidth =
        doc.internal.pageSize.getWidth();

    doc.setFillColor(
        233,
        247,
        239
    );

    doc.roundedRect(
        15,
        y,
        pageWidth-30,
        9,
        2,
        2,
        "F"
    );

    doc.setFillColor(
        22,
        130,
        75
    );

    doc.rect(
        15,
        y,
        3,
        9,
        "F"
    );

    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(10);

    doc.setTextColor(
        22,
        130,
        75
    );

    doc.text(
        title,
        21,
        y+6
    );

    return y+14;

}


/* -----------------------------
   LABEL / VALUE
----------------------------- */

function addLabelValue(
    doc,
    label,
    value,
    x,
    y,
    width
){

    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(8.5);

    doc.setTextColor(
        80,
        80,
        80
    );

    doc.text(
        label,
        x,
        y
    );

    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setTextColor(
        30,
        30,
        30
    );

    const lines =
        wrapText(
            doc,
            value || "-",
            width
        );

    doc.text(
        lines,
        x,
        y+5
    );

    return y + 5 + lines.length*4.5;

}


/* -----------------------------
   CUSTOMER / TRIP BOX
----------------------------- */

function addInfoBox(
    doc,
    title,
    fields,
    y
){

    const pageWidth =
        doc.internal.pageSize.getWidth();

    const boxX = 15;

    const boxWidth =
        pageWidth-30;

    const columns = 2;

    const colWidth =
        boxWidth/columns;

    let rowY = y+15;

    let maxRowHeight = 0;

    fields.forEach((field,index)=>{

        const col =
            index % columns;

        if(index>0 && col===0){

            rowY += maxRowHeight + 6;

            maxRowHeight = 0;

        }

        const x =
            boxX + col*colWidth + 6;

        const h =
            addLabelValue(
                doc,
                field[0],
                field[1],
                x,
                rowY,
                colWidth-15
            );

        maxRowHeight =
            Math.max(
                maxRowHeight,
                h-rowY
            );

    });

    const totalHeight =
        rowY-y+maxRowHeight+5;

    doc.setDrawColor(
        210,
        225,
        215
    );

    doc.roundedRect(
        boxX,
        y,
        boxWidth,
        totalHeight,
        3,
        3,
        "S"
    );

    doc.setFillColor(
        22,
        130,
        75
    );

    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(10);

    doc.text(
        title,
        boxX+6,
        y+8
    );

    return y+totalHeight+8;

}


/* -----------------------------
   BULLET SECTION
----------------------------- */

function addBulletSection(
    doc,
    title,
    text,
    y
){

    y =
        addSectionHeading(
            doc,
            title,
            y
        );

    const lines =
        cleanLines(text);

    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setFontSize(9);

    doc.setTextColor(
        35,
        35,
        35
    );

    lines.forEach(line=>{

        const wrapped =
            wrapText(
                doc,
                line,
                175
            );

        const needed =
            wrapped.length*5 + 2;

        y =
            checkPageSpace(
                doc,
                y,
                needed
            );

        doc.text(
            wrapped,
            20,
            y
        );

        y += wrapped.length*5;

    });

    return y+3;

}


/* -----------------------------
   NORMAL TEXT SECTION
----------------------------- */

function addTextSection(
    doc,
    title,
    text,
    y
){

    y =
        addSectionHeading(
            doc,
            title,
            y
        );

    const lines =
        wrapText(
            doc,
            text || "-",
            175
        );

    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setFontSize(9);

    doc.setTextColor(
        35,
        35,
        35
    );

    lines.forEach(line=>{

        y =
            checkPageSpace(
                doc,
                y,
                6
            );

        doc.text(
            line,
            20,
            y
        );

        y += 5;

    });

    return y+3;

}


/* -----------------------------
   ITINERARY
----------------------------- */

function addItinerary(
    doc,
    itinerary,
    y
){

    y =
        addSectionHeading(
            doc,
            "ITINERARY",
            y
        );

    const lines =
        String(itinerary || "")
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);

    doc.setFontSize(9);

    lines.forEach(line=>{

        const isDay =
            /^day\s*\d+/i.test(line);

        if(isDay){

            y =
                checkPageSpace(
                    doc,
                    y,
                    12
                );

            doc.setFont(
                "helvetica",
                "bold"
            );

            doc.setTextColor(
                22,
                130,
                75
            );

            doc.text(
                line,
                20,
                y
            );

            y+=7;

        }else{

            const clean =
                line.replace(
                    /^[•●▪◦-]\s*/,
                    ""
                );

            const wrapped =
                wrapText(
                    doc,
                    "- " + clean,
                    170
                );

            y =
                checkPageSpace(
                    doc,
                    y,
                    wrapped.length*5+2
                );

            doc.setFont(
                "helvetica",
                "normal"
            );

            doc.setTextColor(
                35,
                35,
                35
            );

            doc.text(
                wrapped,
                23,
                y
            );

            y +=
                wrapped.length*5;

        }

    });

    return y+4;

}


/* -----------------------------
   MAIN PDF
----------------------------- */

async function generatePDF(){

    const form =
        document.getElementById(
            "quotationForm"
        );

    if(!form.checkValidity()){

        form.reportValidity();

        return;

    }

    const logo =
        await loadLogo();

    /*
       Store logo globally
       for watermark function.
    */

    if(logo){

        logo.id = "logoImage";

        document.body.appendChild(logo);

        logo.style.display = "none";

    }


    const doc =
        new jsPDF({
            orientation:"portrait",
            unit:"mm",
            format:"a4"
        });


    const pageWidth =
        doc.internal.pageSize.getWidth();

    let y = 15;


    /* ==========================
       PAGE 1 HEADER
    ========================== */

    if(logo){

        doc.addImage(
            logo,
            "PNG",
            pageWidth/2 - 25,
            y,
            50,
            30
        );

        y += 35;

    }else{

        y += 5;

    }


    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(19);

    doc.setTextColor(
        22,
        130,
        75
    );

    doc.text(
        "TOUR QUOTATION",
        pageWidth/2,
        y,
        {align:"center"}
    );

    y += 7;


    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setFontSize(9);

    doc.setTextColor(
        90,
        90,
        90
    );

    doc.text(
        "Explore • Experience • Enjoy",
        pageWidth/2,
        y,
        {align:"center"}
    );

    y += 8;


    /* Green line */

    doc.setDrawColor(
        22,
        130,
        75
    );

    doc.setLineWidth(0.7);

    doc.line(
        15,
        y,
        pageWidth-15,
        y
    );

    y += 8;


    /* ==========================
       QUOTATION DETAILS
    ========================== */

    y =
        addInfoBox(
            doc,
            "QUOTATION DETAILS",
            [
                [
                    "Quotation No.",
                    document.getElementById(
                        "quotationNo"
                    ).value
                ],
                [
                    "Quotation Date",
                    formatDate(
                        document.getElementById(
                            "quotationDate"
                        ).value
                    )
                ],
                [
                    "Valid Until",
                    formatDate(
                        document.getElementById(
                            "validUntil"
                        ).value
                    )
                ]
            ],
            y
        );


    /* ==========================
       CUSTOMER DETAILS
    ========================== */

    y =
        addInfoBox(
            doc,
            "CUSTOMER DETAILS",
            [
                [
                    "Name",
                    document.getElementById(
                        "customerName"
                    ).value
                ],
                [
                    "Mobile",
                    document.getElementById(
                        "mobile"
                    ).value
                ],
                [
                    "Email",
                    document.getElementById(
                        "email"
                    ).value || "-"
                ]
            ],
            y
        );


    /* ==========================
       TRIP DETAILS
    ========================== */

    y =
        addInfoBox(
            doc,
            "TRIP DETAILS",
            [
                [
                    "Destination",
                    document.getElementById(
                        "destination"
                    ).value
                ],
                [
                    "Pickup",
                    document.getElementById(
                        "pickup"
                    ).value
                ],
                [
                    "Travel Date",
                    formatDate(
                        document.getElementById(
                            "travelDate"
                        ).value
                    )
                ],
                [
                    "Return Date",
                    formatDate(
                        document.getElementById(
                            "returnDate"
                        ).value
                    )
                ],
                [
                    "Adults",
                    document.getElementById(
                        "adults"
                    ).value || "0"
                ],
                [
                    "Children",
                    document.getElementById(
                        "children"
                    ).value || "0"
                ]
            ],
            y
        );


    /* ==========================
       STAY / MEALS / VEHICLE
    ========================== */

    y =
        addInfoBox(
            doc,
            "STAY • MEALS • VEHICLE",
            [
                [
                    "Stay",
                    document.getElementById(
                        "stay"
                    ).value || "-"
                ],
                [
                    "Rooms",
                    document.getElementById(
                        "rooms"
                    ).value || "0"
                ],
                [
                    "Meals",
                    document.getElementById(
                        "meals"
                    ).value || "-"
                ],
                [
                    "Vehicle",
                    document.getElementById(
                        "vehicle"
                    ).value || "-"
                ]
            ],
            y
        );


    /* ==========================
       ITINERARY
    ========================== */

    y =
        addItinerary(
            doc,
            document.getElementById(
                "itinerary"
            ).value,
            y
        );


    /* ==========================
       PAGE 1 FOOTER
    ========================== */

    addFooter(doc);


    /* ==========================
       PAGE 2
    ========================== */

    doc.addPage();

    addPageWatermark(doc);

    y = 20;


    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(14);

    doc.setTextColor(
        22,
        130,
        75
    );

    doc.text(
        "TOUR QUOTATION",
        pageWidth/2,
        y,
        {align:"center"}
    );

    y += 10;


    /* Remaining itinerary automatically continues
       if page 1 was full. */

    const itineraryText =
        document.getElementById(
            "itinerary"
        ).value;

    /*
       We intentionally do not repeat the entire
       itinerary here if it already appeared on page 1.
       Page 2 starts with package details.
    */


    /* ==========================
       PACKAGE COST
    ========================== */

    y =
        addSectionHeading(
            doc,
            "PACKAGE COST",
            y
        );


    y =
        checkPageSpace(
            doc,
            y,
            25
        );


    doc.setFillColor(
        233,
        247,
        239
    );

    doc.roundedRect(
        15,
        y,
        pageWidth-30,
        22,
        3,
        3,
        "F"
    );


    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(13);

    doc.setTextColor(
        22,
        130,
        75
    );

    const price =
        Number(
            document.getElementById(
                "packagePrice"
            ).value || 0
        );


    doc.text(
        `TOTAL PACKAGE Rs. ${price.toLocaleString("en-IN")}`,
        pageWidth/2,
        y+9,
        {align:"center"}
    );


    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setFontSize(9);

    doc.setTextColor(
        60,
        60,
        60
    );

    doc.text(
        "Payment: Full payment required at booking",
        pageWidth/2,
        y+16,
        {align:"center"}
    );

    y += 30;


    /* ==========================
       INCLUSIONS
    ========================== */

    y =
        addBulletSection(
            doc,
            "INCLUSIONS",
            document.getElementById(
                "inclusions"
            ).value,
            y
        );


    /* ==========================
       EXCLUSIONS
    ========================== */

    y =
        addBulletSection(
            doc,
            "EXCLUSIONS",
            document.getElementById(
                "exclusions"
            ).value,
            y
        );


    /* ==========================
       SPECIAL REQUIREMENTS
    ========================== */

    if(
        document.getElementById(
            "specialRequirements"
        ).value.trim()
    ){

        y =
            addTextSection(
                doc,
                "SPECIAL REQUIREMENTS",
                document.getElementById(
                    "specialRequirements"
                ).value,
                y
            );

    }


    addFooter(doc);


    /* ==========================
       PAGE 3
    ========================== */

    doc.addPage();

    addPageWatermark(doc);

    y = 20;


    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(14);

    doc.setTextColor(
        22,
        130,
        75
    );

    doc.text(
        "TERMS & CONDITIONS",
        pageWidth/2,
        y,
        {align:"center"}
    );

    y += 12;


    const terms =
        document.getElementById(
            "terms"
        ).value
        .split(/\r?\n/)
        .map(x=>x.trim())
        .filter(Boolean);


    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setFontSize(9);

    doc.setTextColor(
        35,
        35,
        35
    );


    terms.forEach(term=>{

        const wrapped =
            wrapText(
                doc,
                term,
                170
            );


        y =
            checkPageSpace(
                doc,
                y,
                wrapped.length*5+4
            );


        doc.text(
            wrapped,
            20,
            y
        );


        y +=
            wrapped.length*5+3;

    });


    /* ==========================
       ACCEPTANCE BOX
    ========================== */

    y =
        checkPageSpace(
            doc,
            y,
            35
        );


    doc.setFillColor(
        233,
        247,
        239
    );

    doc.roundedRect(
        15,
        y,
        pageWidth-30,
        27,
        3,
        3,
        "F"
    );


    doc.setFont(
        "helvetica",
        "bold"
    );

    doc.setFontSize(9);

    doc.setTextColor(
        22,
        130,
        75
    );

    doc.text(
        "CUSTOMER ACCEPTANCE",
        21,
        y+8
    );


    doc.setFont(
        "helvetica",
        "normal"
    );

    doc.setTextColor(
        45,
        45,
        45
    );

    doc.text(
        "By making the full payment, the customer confirms",
        21,
        y+14
    );

    doc.text(
        "acceptance of the quotation and Terms & Conditions.",
        21,
        y+19
    );


    y += 35;


    addFooter(doc);


    /* ==========================
       SAVE PDF
    ========================== */

    const quotationNo =
        document.getElementById(
            "quotationNo"
        ).value;


    doc.save(
        `${quotationNo}-Quotation.pdf`
    );


    if(logo){

        logo.remove();

    }

}


/* -----------------------------
   SAVE DRAFT
----------------------------- */

function saveDraft(){

    const fields = [

        "quotationNo",
        "quotationDate",
        "validUntil",
        "customerName",
        "mobile",
        "email",
        "destination",
        "pickup",
        "travelDate",
        "returnDate",
        "adults",
        "children",
        "stay",
        "rooms",
        "meals",
        "vehicle",
        "itinerary",
        "packagePrice",
        "inclusions",
        "exclusions",
        "specialRequirements",
        "terms"

    ];

    const data = {};

    fields.forEach(id=>{

        data[id] =
            document.getElementById(
                id
            ).value;

    });


    localStorage.setItem(
        "mauliQuotationDraft",
        JSON.stringify(data)
    );


    alert(
        "Quotation draft saved on this phone."
    );

}


/* -----------------------------
   LOAD DRAFT
----------------------------- */

function loadDraft(){

    const saved =
        localStorage.getItem(
            "mauliQuotationDraft"
        );


    if(!saved){

        alert(
            "No saved quotation draft found."
        );

        return;

    }


    const data =
        JSON.parse(saved);


    Object.keys(data).forEach(id=>{

        const element =
            document.getElementById(id);

        if(element){

            element.value =
                data[id];

        }

    });


    alert(
        "Saved quotation draft loaded."
    );

}

</script>
